name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Installer and rollback recovery tests
        run: bash scripts/tests/install-rollback.sh
      - name: Unit tests
        run: |
          xcodebuild test \
            -project "AI Usage Monitor.xcodeproj" \
            -scheme "AI Usage Monitor" \
            -destination platform=macOS \
            -only-testing:"AI Usage MonitorTests" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --exit-code 1 .
